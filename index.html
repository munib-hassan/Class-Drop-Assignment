<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>ClassDrop | BSE Class, Spring 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0f19;color:#f5f7fb;min-height:100vh}
button,input{font:inherit}
header{max-width:1050px;margin:auto;padding:24px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:28px;font-weight:800;font-style:italic}.sub{font-size:13px;color:#8f9bb0;margin-top:3px}
.cr-btn{background:transparent;color:#dce3ef;border:1px solid #33405a;border-radius:10px;padding:10px 14px;cursor:pointer}
main{max-width:700px;margin:55px auto;padding:0 18px 40px}
.card{background:#151c2e;border:1px solid #2a3449;border-radius:18px;padding:28px;box-shadow:0 15px 40px #0004}
h1{margin:0 0 8px;font-size:27px}.desc{color:#929db1;margin:0 0 25px}
label{display:block;font-size:14px;font-weight:700;margin:17px 0 8px}
input[type=text],input[type=password]{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #34415a;background:#0e1422;color:white;outline:none}
input:focus{border-color:#8b5cf6}
.drop{border:2px dashed #3b4760;border-radius:14px;padding:28px 15px;text-align:center;margin-top:8px;cursor:pointer;background:#101726}
.drop:hover{border-color:#8b5cf6}.drop-icon{font-size:30px;margin-bottom:8px}.drop-title{font-weight:700}
.drop-note{font-size:12px;color:#8995aa;margin-top:6px}#fileName{margin-top:10px;color:#b9c3d4;font-size:13px;word-break:break-word}
.submit{width:100%;border:0;border-radius:11px;background:#8b5cf6;color:white;padding:14px;margin-top:22px;font-weight:800;cursor:pointer}
.submit:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:14px;text-align:center;font-size:13px;min-height:20px;color:#aeb9ca}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}
.modal-box{width:min(460px,100%);background:#151c2e;border:1px solid #2a3449;border-radius:18px;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;color:#aab4c5;font-size:25px;cursor:pointer}
.dashboard{display:none;max-width:1050px;margin:35px auto;padding:0 18px 50px}.dashboard.show{display:block}
.table-wrap{overflow-x:auto;background:#151c2e;border:1px solid #2a3449;border-radius:15px}
table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:14px;border-bottom:1px solid #283247;text-align:left;font-size:13px}
th{color:#aab5c8;background:#111827}td{color:#e2e7ef}
.action{display:inline-block;text-decoration:none;color:white;background:#8b5cf6;border-radius:8px;padding:7px 10px;margin-right:5px}
.clear{margin-top:15px;border:0;background:#b4233c;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700}
.logout{margin-top:15px;border:1px solid #33405a;background:transparent;color:#dce3ef;padding:9px 13px;border-radius:9px;cursor:pointer}
.empty{padding:25px;text-align:center;color:#8e9aaf}
@media(max-width:600px){
 header{padding-top:18px}.brand{font-size:24px}.cr-btn{padding:9px 11px}
 main{margin:28px auto}.card{padding:21px;border-radius:15px}h1{font-size:23px}
 .drop{padding:25px 10px}.submit{padding:15px}
}
</style>
</head>
<body>

<header>
  <div><div class="brand">ClassDrop</div><div class="sub">BSE Class, Spring 2026</div></div>
  <button class="cr-btn" id="crLoginBtn">CR login</button>
</header>

<main id="submitSection">
<div class="card">
<h1>Submit your assignment</h1>
<p class="desc">Fill in your details and attach your PDF.</p>

<label for="studentName">Full name</label>
<input id="studentName" type="text" placeholder="e. g. Munib Hassan" autocomplete="name">

<label for="rollNumber">Roll number</label>
<input id="rollNumber" type="text" placeholder="e. g. SP26-BSE-069" autocomplete="off">

<label for="subject">Subject / assignment</label>
<input id="subject" type="text" placeholder="e. g. Pre Calculus 2 – Assignment 1">

<label>Assignment PDF</label>
<div class="drop" id="dropZone">
<div class="drop-icon">↑</div>
<div class="drop-title">Choose PDF file</div>
<div class="drop-note">PDF only · Maximum 20 MB</div>
<div id="fileName">No file selected</div>
<input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
</div>

<button class="submit" id="submitBtn">Submit Assignment</button>
<div class="status" id="status"></div>
</div>
</main>

<section class="dashboard" id="dashboard">
<div class="card">
<h1>CR Dashboard</h1>
<p class="desc">Submitted assignments</p>

<div class="table-wrap">
<table>
<thead><tr>
<th>Student Name</th><th>Roll Number</th><th>Subject</th>
<th>Filename</th><th>Timestamp</th><th>PDF</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
<div class="empty" id="empty">Loading...</div>
</div>

<button class="clear" id="clearBtn">🗑️ Clear All Files</button>
<div class="status" id="clearStatus"></div>
<button class="logout" id="logoutBtn">Back to submission</button>
</div>
</section>

<div class="modal" id="loginModal">
<div class="modal-box">
<div class="modal-head"><h2>CR Login</h2><button class="close" id="closeModal">&times;</button></div>
<p class="desc">Enter the CR password.</p>
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button class="submit" id="loginBtn">Login</button>
<div class="status" id="loginStatus"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://hltzvgyguapmefiicdme.supabase.co";
const SUPABASE_KEY="sb_publishable_rNhp0UxKRVl_susC_UFK8g_k6lLcdBm";
const BUCKET="assignments";
const CR_PASSWORD="munib123";
const MAX_SIZE=20*1024*1024;

const $=id=>document.getElementById(id);
const dropZone=$("dropZone");
const pdfFile=$("pdfFile");
const fileName=$("fileName");
const submitBtn=$("submitBtn");
const statusBox=$("status");

function setStatus(msg,ok=false){
 statusBox.textContent=msg;
 statusBox.style.color=ok?"#72e0a1":"#aeb9ca";
}

dropZone.addEventListener("click",()=>pdfFile.click());

pdfFile.addEventListener("change",()=>{
 const f=pdfFile.files&&pdfFile.files[0];
 fileName.textContent=f?f.name:"No file selected";
});

["dragenter","dragover"].forEach(type=>{
 dropZone.addEventListener(type,e=>{
  e.preventDefault();
  e.stopPropagation();
  dropZone.style.borderColor="#8b5cf6";
 });
});

["dragleave","drop"].forEach(type=>{
 dropZone.addEventListener(type,e=>{
  e.preventDefault();
  e.stopPropagation();
  dropZone.style.borderColor="";
 });
});

dropZone.addEventListener("drop",e=>{
 const f=e.dataTransfer.files&&e.dataTransfer.files[0];
 if(!f)return;
 try{
  const dt=new DataTransfer();
  dt.items.add(f);
  pdfFile.files=dt.files;
  fileName.textContent=f.name;
 }catch{
  fileName.textContent="Please use Choose PDF file on mobile.";
 }
});

function uploadPDF(file,name,roll,subject,onProgress){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();
  const form=new FormData();

  form.append("student_name",name);
  form.append("roll_number",roll);
  form.append("subject",subject);
  form.append("filename",file.name);
  form.append("file",file,file.name);

  xhr.open("POST",SUPABASE_URL+"/functions/v1/submit-assignment",true);
  xhr.timeout=180000;

  // IMPORTANT:
  // Do not add Content-Type or Authorization here.
  // FormData must set its own multipart boundary.
  // Keeping only Accept avoids unnecessary CORS preflight on mobile.
  xhr.setRequestHeader("Accept","application/json");

  xhr.upload.onprogress=e=>{
   if(e.lengthComputable&&onProgress){
    onProgress(Math.round((e.loaded/e.total)*100));
   }
  };

  xhr.onload=()=>{
   let data={};
   try{data=JSON.parse(xhr.responseText||"{}")}catch{}

   if(xhr.status>=200&&xhr.status<300&&data.ok){
    resolve(data);
   }else{
    reject(new Error(
      data.error||data.detail||("Server error ("+xhr.status+")")
    ));
   }
  };

  xhr.onerror=()=>{
   reject(new Error("Network request failed. Please check internet and try again."));
  };

  xhr.ontimeout=()=>{
   reject(new Error("Upload timed out. Please try a smaller PDF."));
  };

  xhr.onabort=()=>{
   reject(new Error("Upload was cancelled."));
  };

  try{
   xhr.send(form);
  }catch(err){
   reject(err);
  }
 });
}

submitBtn.addEventListener("click",async()=>{
 const name=$("studentName").value.trim();
 const roll=$("rollNumber").value.trim();
 const subject=$("subject").value.trim();
 const file=pdfFile.files&&pdfFile.files[0];

 if(!name||!roll||!subject){
  setStatus("Please fill in all details.");
  return;
 }

 if(!file){
  setStatus("Please choose your PDF.");
  return;
 }

 const isPDF=file.type==="application/pdf"||
             file.name.toLowerCase().endsWith(".pdf");

 if(!isPDF){
  setStatus("Only PDF files are allowed.");
  return;
 }

 if(file.size>MAX_SIZE){
  setStatus("PDF is larger than 20 MB.");
  return;
 }

 if(file.size===0){
  setStatus("This file appears to be empty. Please choose another PDF.");
  return;
 }

 submitBtn.disabled=true;
 submitBtn.textContent="Uploading 0%...";
 setStatus("Uploading your PDF...");

 try{
  await uploadPDF(file,name,roll,subject,p=>{
   submitBtn.textContent="Uploading "+p+"%...";
   setStatus("Uploading your PDF... "+p+"%");
  });

  setStatus("Assignment submitted successfully! ✓",true);

  $("studentName").value="";
  $("rollNumber").value="";
  $("subject").value="";
  pdfFile.value="";
  fileName.textContent="No file selected";

  submitBtn.textContent="Submitted ✓";

  setTimeout(()=>{
   submitBtn.disabled=false;
   submitBtn.textContent="Submit Assignment";
  },2500);

 }catch(err){
  console.error(err);
  setStatus("Upload failed: "+(err.message||"Please try again."));
  submitBtn.disabled=false;
  submitBtn.textContent="Submit Assignment";
 }
});

// ---------------- CR LOGIN ----------------

$("crLoginBtn").addEventListener("click",()=>{
 $("loginModal").classList.add("show");
 $("password").focus();
});

$("closeModal").addEventListener("click",()=>{
 $("loginModal").classList.remove("show");
});

$("loginModal").addEventListener("click",e=>{
 if(e.target===$("loginModal")){
  $("loginModal").classList.remove("show");
 }
});

$("password").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("loginBtn").click();
});

$("loginBtn").addEventListener("click",async()=>{
 const password=$("password").value;

 if(password!==CR_PASSWORD){
  $("loginStatus").textContent="Incorrect password.";
  return;
 }

 $("loginStatus").textContent="Loading...";
 $("loginBtn").disabled=true;

 try{
  await loadDashboard();

  $("loginModal").classList.remove("show");
  $("password").value="";
  $("submitSection").style.display="none";
  $("dashboard").classList.add("show");
  $("crLoginBtn").style.display="none";

 }catch(err){
  $("loginStatus").textContent=
    "Could not load submissions: "+err.message;
 }finally{
  $("loginBtn").disabled=false;
 }
});

// ---------------- DASHBOARD ----------------

function publicPDF(path){
 return SUPABASE_URL+
 "/storage/v1/object/public/"+
 BUCKET+"/"+
 path.split("/").map(encodeURIComponent).join("/");
}

async function loadDashboard(){
 const url=
 SUPABASE_URL+
 "/rest/v1/assignments?select=*&order=submitted_at.desc";

 const res=await fetch(url,{
  method:"GET",
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+SUPABASE_KEY
  },
  cache:"no-store"
 });

 if(!res.ok){
  throw new Error("("+res.status+") "+await res.text());
 }

 const data=await res.json();
 const rows=$("rows");

 rows.innerHTML="";

 if(!data.length){
  $("empty").style.display="block";
  $("empty").textContent="No submissions yet.";
  return;
 }

 $("empty").style.display="none";

 data.forEach(item=>{
  const tr=document.createElement("tr");
  const date=item.submitted_at
   ?new Date(item.submitted_at).toLocaleString()
   :"-";

  const url=publicPDF(item.file_path);

  const cells=[
   item.student_name||"-",
   item.roll_number||"-",
   item.subject||"-",
   item.filename||"-",
   date
  ];

  cells.forEach(value=>{
   const td=document.createElement("td");
   td.textContent=value;
   tr.appendChild(td);
  });

  const actionTd=document.createElement("td");

  const open=document.createElement("a");
  open.className="action";
  open.href=url;
  open.target="_blank";
  open.rel="noopener";
  open.textContent="Open";

  const download=document.createElement("a");
  download.className="action";
  download.href=url;
  download.target="_blank";
  download.rel="noopener";
  download.setAttribute("download",item.filename||"assignment.pdf");
  download.textContent="Download";

  actionTd.append(open,download);
  tr.appendChild(actionTd);

  rows.appendChild(tr);
 });
}

// ---------------- CLEAR BUTTON ----------------
//
// The visible button is included here.
// IMPORTANT: the browser must NOT directly delete Supabase files.
// Actual permanent deletion needs a protected server-side delete endpoint.
// Until that endpoint is connected, this button only clears the dashboard view.

$("clearBtn").addEventListener("click",()=>{
 const confirmed=confirm(
  "⚠️ Clear all files from this dashboard?\n\n"+
  "This clears the list shown on this page. "+
  "It does not permanently delete Supabase files."
 );

 if(!confirmed)return;

 $("rows").innerHTML="";
 $("empty").style.display="block";
 $("empty").textContent="No submissions shown.";

 $("clearStatus").textContent=
  "Dashboard list cleared. Permanent file deletion needs the server delete function.";
});

$("logoutBtn").addEventListener("click",()=>{
 $("dashboard").classList.remove("show");
 $("submitSection").style.display="";
 $("crLoginBtn").style.display="";
 $("clearStatus").textContent="";
});
</script>
</body>
</html>
